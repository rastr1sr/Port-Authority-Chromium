<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Port Authority Test</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #800000;
            --accent-hover: #600000;
            --bg: #f7f7f7;
            --fg: #333333;
            --fg-muted: #666666;
            --border: #e0e0e0;
            --card-bg: #ffffff;
            --code-bg: #f0f0f0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #B20000;
                --accent-hover: #800000;
                --bg: #1e1e1e;
                --fg: #e0e0e0;
                --fg-muted: #aaaaaa;
                --border: #444444;
                --card-bg: #2a2a2a;
                --code-bg: #333333;
            }
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            min-height: 100vh;
            padding: clamp(1.5rem, 5vw, 4rem);
            display: grid;
            place-items: center;
        }
        main {
            max-width: 70ch;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: clamp(1.5rem, 4vw, 3rem);
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent);
        }
        h2 {
            font-size: 1.1rem;
            margin: 2.5rem 0 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        p {
            margin-bottom: 1.25rem;
            color: var(--fg-muted);
        }
        p strong { color: var(--fg); }
        a { color: var(--accent); }
        code, pre {
            font-family: ui-monospace, "Cascadia Mono", "Roboto Mono", monospace;
            background-color: var(--code-bg);
            border-radius: 4px;
        }
        code { padding: 0.2em 0.4em; font-size: 0.9em; color: var(--accent); }
        pre {
            border: 1px solid var(--border);
            padding: 1em;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.8rem;
            color: var(--fg-muted);
        }
        #scan_button {
            display: block;
            margin: 2.5rem auto;
            padding: 0.8rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: #ffffff;
            cursor: pointer;
        }
        #scan_button:hover:not([disabled]) { background-color: var(--accent-hover); }
        #scan_button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        #scan_button[disabled] { cursor: wait; opacity: 0.6; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>Port Scan Test</h1>
        <button id="scan_button">Run Scans</button>
        <ol>
            <li>Click the button</li>
            <li>Open DevTools (F12) and look at the <a href="https://developer.chrome.com/docs/devtools/network/" target="_blank">Network</a> tab</li>
            <li>Requests to local IPs should show as blocked, and the badge should count them</li>
        </ol>
        <p>
            Probes local addresses over <code>HTTP</code>, <code>HTTPS</code>, <code>WS</code> and <code>WSS</code>, plus known tracker domains. Nothing leaves your computer.
        </p>
        <h2 id="results-label" hidden>Attempted:</h2>
        <pre id="results" hidden></pre>
        <div id="testdiv" hidden></div>
    </main>
    <script>
        const trigger_scan_button = document.getElementById("scan_button");
        const results_label = document.getElementById("results-label");
        const results_container = document.getElementById("results");
        const test_div = document.getElementById("testdiv");

        // append() makes a text node; no escaping needed.
        const log_scan_attempt = (url) => results_container.append(url + "\n");

        function imageProbe(url) {
            log_scan_attempt(url);
            const img = document.createElement("img");
            img.src = url;
            img.alt = "";
            test_div.appendChild(img);
            setTimeout(() => img.remove(), 5000);
        }

        function websocketProbe(url) {
            log_scan_attempt(url);
            try {
                const ws = new WebSocket(url);
                ws.onerror = () => { try { ws.close(); } catch (e) {} };
                setTimeout(() => { try { if (ws.readyState < 2) ws.close(); } catch (e) {} }, 3000);
            } catch (e) {}
        }

        function scan(host, port) {
            if (isNaN(port) || port <= 0 || port > 65535) { console.error("bad port", port); return; }
            const target = `${host}:${port}`;
            imageProbe(`http://${target}`);
            imageProbe(`https://${target}`);
            websocketProbe(`ws://${target}/`);
            websocketProbe(`wss://${target}/`);
        }

        function run_combined_scan() {
            const localTargets = [["127.0.0.1",80],["127.0.0.1",65535],["0.0.0.0",80],["localhost.",80],["localhost.",8080],["localhost",8080],["localhost",8081],["localhost",8082],["localhost",8083],["localhost",8084],["localhost",8085],["LoCALhOst",443],["10.0.0.1",455],["10.255.22.33",80],["192.168.1.1",443],["192.168.1.255",6463],["172.17.100.155",4444],["172.31.255.255",8081],["172.031.33.33",445],["169.254.1.0",547],["169.254.1.0",21],["169.254.1.0",194]];
            const trackerTargets = ["fp.disney.go.com","h.chase.co.uk","analytics.vacations.united.com","tmx.bestbuy.com","thm12.visa.com","tmetrix.my.chick-fil-a.com","cfa.fidelity.com","content22.citibank.com","deviceauth.dmv.ca.gov","dfp.t-mobile.at","src.ebay-us.com","fp.ups.com"];

            trigger_scan_button.disabled = true;
            trigger_scan_button.blur();
            results_label.hidden = false;
            results_container.hidden = false;
            results_container.innerText = "";
            test_div.innerHTML = "";

            for (const [host, port] of localTargets) scan(host, port);
            for (const host of trackerTargets) imageProbe(`https://${host}`);

            setTimeout(() => { trigger_scan_button.disabled = false; }, 1000);
        }

        trigger_scan_button.addEventListener("click", run_combined_scan);
    </script>
</body>
</html>
