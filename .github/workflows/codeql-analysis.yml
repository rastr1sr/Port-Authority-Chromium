# Name for the workflow
name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Saturday at 01:15 UTC
    - cron: '15 1 * * 6'

jobs:
  analyze:
    name: Analyze Codebase
    runs-on: ubuntu-latest

    # Permissions required by CodeQL to analyze and upload results
    permissions:
      actions: read       # To read workflow files
      contents: read      # To check out the repository
      security-events: write # To upload CodeQL analysis results

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # Supported languages: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Optionally specify custom queries here or in a config file
        # queries: +security-extended,./.github/codeql/custom-queries

    # NOTE: Autobuild step is removed as it is not needed for JavaScript analysis

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
         # Optional: Define category for SARIF upload status check
         category: "/language:${{matrix.language}}"